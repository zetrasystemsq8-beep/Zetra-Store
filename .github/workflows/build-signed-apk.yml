name: Build Signed APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'
      
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
      
      - name: Generate Keystore
        run: |
          keytool -genkey -v -keystore $GITHUB_WORKSPACE/zetra_keystore.jks \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias zetra_key \
            -storepass ${{ secrets.STORE_PASSWORD }} \
            -keypass ${{ secrets.KEY_PASSWORD }} \
            -dname "CN=Zetra Store, O=Zetra, C=NG"
      
      - name: Create key.properties
        run: |
          echo "storePassword=${{ secrets.STORE_PASSWORD }}" > android/key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties
          echo "keyAlias=zetra_key" >> android/key.properties
          echo "storeFile=zetra_keystore.jks" >> android/key.properties
      
      - name: Get dependencies
        run: flutter pub get
      
      - name: Build signed APK
        run: flutter build apk --release
      
      - name: Upload APK
        uses: actions/upload-artifact@v3
        with:
          name: zetra-store-signed.apk
          path: build/app/outputs/flutter-app.apk
      
      - name: Upload Keystore
        uses: actions/upload-artifact@v3
        with:
          name: zetra_keystore.jks
          path: zetra_keystore.jks

name: Build Zetra Store APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Verify Zetra Store logo
        run: |
          if [ ! -f "assets/ic_launcher.png" ]; then
            echo "ERROR: assets/ic_launcher.png was not found."
            exit 1
          fi
          echo "Zetra Store logo found: assets/ic_launcher.png"

      - name: Generate Android launcher icons
        run: |
          dart pub global activate flutter_launcher_icons
          flutter pub run flutter_launcher_icons

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > zetra_keystore.jks

      - name: Build APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          flutter build apk --release \
            --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} \
            --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }} \
            --dart-define=WORKER_URL=${{ secrets.WORKER_URL }} \
            --dart-define=WORKER_API_KEY=${{ secrets.WORKER_API_KEY }} \
            --dart-define=ADMIN_PIN=${{ secrets.ADMIN_PIN }}

      - name: Upload APK (build artifact, for internal testing)
        uses: actions/upload-artifact@v4
        with:
          name: zetra-store-release
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Publish public GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: latest
          name: Zetra Store (latest build)
          body: Automatically published on every push to main.
          allowUpdates: true
          replacesArtifacts: true
          artifacts: build/app/outputs/flutter-apk/app-release.apk
          token: ${{ secrets.GITHUB_TOKEN }}

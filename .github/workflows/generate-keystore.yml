name: Generate Release Keystore

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate keystore
        run: |
          keytool -genkey -v -keystore zetra_keystore.jks \
            -storetype JKS -keyalg RSA -keysize 2048 -validity 10000 \
            -alias zetraapps \
            -storepass "ZetraProd2026Key!" \
            -keypass "ZetraProd2026Key!" \
            -dname "CN=Zetra Store, OU=Zetra, O=Zetra Store, L=Lagos, S=Lagos, C=NG"

      - name: Base64 encode keystore
        run: base64 -w 0 zetra_keystore.jks > keystore_base64.txt

      - name: Upload keystore files
        uses: actions/upload-artifact@v4
        with:
          name: keystore-files
          path: |
            zetra_keystore.jks
            keystore_base64.txt
          retention-days: 5

name: zetra_store
description: Zetra Store - Discover. Test. Launch.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.8.0
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  image_picker: ^1.1.2
  file_picker: ^8.1.4
  cached_network_image: ^3.4.1
  intl: ^0.19.0
  uuid: ^4.5.1
  google_fonts: ^6.2.1
  http: ^1.2.2
  path_provider: ^2.1.4
  open_filex: ^4.5.0
  shared_preferences: ^2.3.2
  installed_apps: ^2.1.1
  package_info_plus: ^8.1.1
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/ic_launcher.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/ic_launcher.png"
  min_sdk_android: 21
